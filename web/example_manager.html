<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý ví dụ · LingoFlow</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f7fb; color: #182033; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .page { max-width: 1180px; margin: 0 auto; padding: 28px 20px 44px; }
    [hidden] { display: none !important; }
    .auth-gate { max-width: 440px; margin: 12vh auto 0; padding: 28px; }
    .auth-gate h1 { font-size: 28px; }
    .auth-form { display: grid; gap: 12px; margin-top: 24px; }
    .auth-help { margin-top: 14px; color: #667085; font-size: 13px; line-height: 1.5; }
    .auth-error { min-height: 20px; color: #b42318; font-size: 13px; }
    .login-button { border: 0; border-radius: 10px; padding: 11px 15px; background: #5151c9; color: #fff; font-weight: 700; }
    .login-button:disabled { cursor: wait; opacity: .55; }
    .topbar { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    .topbar-actions { display: flex; align-items: center; gap: 12px; }
    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(24px, 4vw, 34px); letter-spacing: -.03em; }
    .subtitle { margin-top: 6px; color: #667085; font-size: 14px; }
    .status { color: #667085; font-size: 13px; text-align: right; }
    .status.error { color: #b42318; }
    .layout { display: grid; grid-template-columns: minmax(280px, .9fr) minmax(360px, 1.1fr); gap: 18px; align-items: start; }
    .panel { background: #fff; border: 1px solid #e5e9f2; border-radius: 16px; box-shadow: 0 8px 24px rgba(20, 35, 70, .05); }
    .list-panel { overflow: hidden; }
    .toolbar { padding: 14px; border-bottom: 1px solid #edf0f5; display: grid; gap: 10px; }
    .toolbar-row { display: flex; gap: 8px; }
    input, select, textarea { width: 100%; border: 1px solid #d8deea; border-radius: 10px; background: #fff; color: #182033; outline: 0; }
    input, select { height: 40px; padding: 0 12px; }
    textarea { min-height: 108px; padding: 12px; resize: vertical; line-height: 1.5; }
    input:focus, select:focus, textarea:focus { border-color: #5b5bd6; box-shadow: 0 0 0 3px rgba(91, 91, 214, .12); }
    .word-list { min-height: 380px; max-height: 600px; overflow: auto; }
    .word-row { width: 100%; display: block; border: 0; border-bottom: 1px solid #f0f2f6; background: transparent; padding: 13px 15px; text-align: left; }
    .word-row:hover, .word-row.selected { background: #f2f3ff; }
    .word-main { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .word { font-weight: 700; color: #252b55; overflow-wrap: anywhere; }
    .meaning { margin-top: 5px; color: #667085; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badge { flex: 0 0 auto; padding: 4px 8px; border-radius: 999px; background: #f2f4f7; color: #667085; font-size: 11px; }
    .badge.done { background: #e8f7ee; color: #16794a; }
    .empty, .loading { padding: 36px 18px; color: #98a2b3; text-align: center; font-size: 14px; }
    .pagination { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px; border-top: 1px solid #edf0f5; color: #667085; font-size: 13px; }
    .pagination button, .ghost { border: 1px solid #d8deea; border-radius: 9px; padding: 7px 10px; background: #fff; color: #344054; }
    .pagination button:disabled { cursor: not-allowed; opacity: .45; }
    .editor { padding: 22px; }
    .editor.empty-editor { min-height: 520px; display: grid; place-items: center; color: #98a2b3; text-align: center; }
    .editor-head { display: flex; align-items: start; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .editor h2 { font-size: 23px; overflow-wrap: anywhere; }
    .meta { margin-top: 5px; color: #667085; font-size: 13px; line-height: 1.5; }
    .field { display: grid; gap: 7px; margin-top: 15px; }
    label { color: #344054; font-size: 13px; font-weight: 700; }
    .actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; }
    .primary, .danger { border: 0; border-radius: 10px; padding: 10px 15px; color: #fff; font-weight: 700; }
    .primary { background: #5151c9; }
    .primary:hover { background: #4141ae; }
    .danger { background: #d92d20; }
    .danger:disabled, .primary:disabled { cursor: wait; opacity: .55; }
    .preview { margin-top: 20px; padding: 15px; border-radius: 12px; background: #f7f8fc; border: 1px solid #edf0f5; }
    .preview-title { color: #667085; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
    .preview-sentence { margin-top: 8px; line-height: 1.55; }
    .preview-translation { margin-top: 4px; color: #667085; line-height: 1.55; }
    @media (max-width: 780px) {
      .page { padding: 20px 12px 32px; }
      .topbar { display: block; }
      .status { margin-top: 10px; text-align: left; }
      .layout { grid-template-columns: 1fr; }
      .word-list { max-height: 360px; min-height: 160px; }
      .editor.empty-editor { min-height: 220px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section id="auth-gate" class="panel auth-gate">
      <h1>Quản lý ví dụ</h1>
      <p class="subtitle">Nhập số điện thoại LingoFlow để tiếp tục.</p>
      <form id="login-form" class="auth-form">
        <label for="phone">Số điện thoại</label>
        <input id="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="10" placeholder="9xx xxx xxx" required>
        <div id="auth-error" class="auth-error" role="alert"></div>
        <button id="login-button" class="login-button" type="submit">Đăng nhập</button>
      </form>
      <p class="auth-help">Số điện thoại cần được đăng ký trong ứng dụng LingoFlow trước.</p>
    </section>

    <div id="manager-shell" hidden>
      <header class="topbar">
        <div>
          <h1>Quản lý ví dụ</h1>
          <p class="subtitle">Mỗi từ có một câu ví dụ tiếng Anh và bản dịch tiếng Việt.</p>
        </div>
        <div class="topbar-actions">
          <div id="status" class="status" role="status"></div>
          <button id="logout" class="ghost" type="button">Đăng xuất</button>
        </div>
      </header>

      <section class="layout">
      <div class="panel list-panel">
        <div class="toolbar">
          <input id="search" type="search" placeholder="Tìm từ, nghĩa hoặc chủ đề..." autocomplete="off">
          <div class="toolbar-row">
            <select id="example-filter" aria-label="Lọc trạng thái ví dụ">
              <option value="all">Tất cả từ</option>
              <option value="true">Đã có ví dụ</option>
              <option value="false">Chưa có ví dụ</option>
            </select>
            <button id="refresh" class="ghost" type="button">Tải lại</button>
          </div>
        </div>
        <div id="word-list" class="word-list"></div>
        <div class="pagination">
          <button id="previous" type="button">← Trước</button>
          <span id="page-label">Trang 1</span>
          <button id="next" type="button">Sau →</button>
        </div>
      </div>

      <div id="editor" class="panel editor empty-editor">
        <div>Chọn một từ bên trái để thêm hoặc chỉnh sửa ví dụ.</div>
      </div>
      </section>
    </div>
  </main>

  <script>
    const state = { page: 1, pageSize: 50, query: '', hasExample: 'all', rows: [], selected: null, totalPages: 0 };
    const $ = (id) => document.getElementById(id);

    function getToken() {
      return localStorage.getItem('auth_token')
        || localStorage.getItem('flutter.auth_token')
        || localStorage.getItem('lingoflow.auth_token')
        || '';
    }

    function clearToken() {
      localStorage.removeItem('auth_token');
      localStorage.removeItem('flutter.auth_token');
      localStorage.removeItem('lingoflow.auth_token');
    }

    function formatPhone(value) {
      let digits = String(value || '').replace(/\D/g, '');
      if (digits.length === 10 && digits.startsWith('0')) digits = digits.slice(1);
      if (digits.length !== 9) throw new Error('Vui lòng nhập đủ 9 số điện thoại.');
      return `+84${digits}`;
    }

    function showAuth(message = '') {
      $('auth-gate').hidden = false;
      $('manager-shell').hidden = true;
      $('auth-error').textContent = message;
      $('phone').focus();
    }

    function showManager() {
      $('auth-gate').hidden = true;
      $('manager-shell').hidden = false;
      loadWords();
    }

    async function login(phoneInput) {
      const response = await fetch('/api/lingoflow', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'loginUser', data: { phoneNumber: formatPhone(phoneInput) } }),
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok || !payload.data) {
        throw new Error(payload.error || 'Số điện thoại chưa đăng ký hoặc đăng nhập thất bại.');
      }
      const token = payload.data.token;
      if (!token) throw new Error('Server không trả về phiên đăng nhập hợp lệ.');
      localStorage.setItem('auth_token', token);
      localStorage.setItem('flutter.auth_token', token);
    }

    function setStatus(message, isError = false) {
      const el = $('status');
      el.textContent = message;
      el.className = isError ? 'status error' : 'status';
    }

    async function api(path, options = {}) {
      const token = getToken();
      if (!token) throw new Error('Hãy đăng nhập LingoFlow trước khi quản lý ví dụ.');
      const headers = { Authorization: `Bearer ${token}`, ...(options.body ? { 'Content-Type': 'application/json' } : {}) };
      const response = await fetch(path, { ...options, headers: { ...headers, ...(options.headers || {}) } });
      const payload = await response.json().catch(() => ({}));
      if (response.status === 401) {
        clearToken();
        showAuth('Phiên đăng nhập hết hạn. Vui lòng nhập lại số điện thoại.');
      }
      if (!response.ok) throw new Error(payload.error?.message || `Request thất bại (HTTP ${response.status}).`);
      return payload.data;
    }

    function createText(text, className) {
      const node = document.createElement('div');
      node.textContent = text || '';
      if (className) node.className = className;
      return node;
    }

    function renderWords() {
      const list = $('word-list');
      list.replaceChildren();
      if (state.rows.length === 0) {
        list.append(createText('Không tìm thấy từ phù hợp.', 'empty'));
        return;
      }
      for (const row of state.rows) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `word-row${state.selected?.id === row.id ? ' selected' : ''}`;
        const main = document.createElement('div');
        main.className = 'word-main';
        main.append(createText(row.word, 'word'));
        const badge = createText(row.exampleSentence ? 'Đã có ví dụ' : 'Chưa có ví dụ', `badge${row.exampleSentence ? ' done' : ''}`);
        main.append(badge);
        button.append(main, createText(row.meaning, 'meaning'));
        button.addEventListener('click', () => selectWord(row));
        list.append(button);
      }
    }

    function renderHighlight(element, sentence, target) {
      element.replaceChildren();
      if (!sentence) return;
      const start = target ? sentence.toLocaleLowerCase().indexOf(target.toLocaleLowerCase()) : -1;
      if (start < 0) {
        element.append(document.createTextNode(sentence));
        return;
      }
      element.append(document.createTextNode(sentence.slice(0, start)));
      const strong = document.createElement('strong');
      strong.textContent = sentence.slice(start, start + target.length);
      element.append(strong, document.createTextNode(sentence.slice(start + target.length)));
    }

    function renderEditor() {
      if (!state.selected) {
        $('editor').className = 'panel editor empty-editor';
        $('editor').textContent = 'Chọn một từ bên trái để thêm hoặc chỉnh sửa ví dụ.';
        return;
      }
      $('editor').className = 'panel editor';
      $('editor').replaceChildren();
      const head = document.createElement('div');
      head.className = 'editor-head';
      const title = document.createElement('div');
      title.append(createText(state.selected.word, 'word'), createText(`${state.selected.pronunciation || 'Chưa có phát âm'} · ${state.selected.meaning}`, 'meta'));
      const close = document.createElement('button');
      close.className = 'ghost';
      close.type = 'button';
      close.textContent = 'Bỏ chọn';
      close.addEventListener('click', () => { state.selected = null; renderWords(); renderEditor(); });
      head.append(title, close);
      $('editor').append(head);

      const sentence = document.createElement('textarea');
      sentence.id = 'sentence';
      sentence.maxLength = 1000;
      sentence.placeholder = "I'm tired. I'm gonna lie down for a while.";
      sentence.value = state.selected.exampleSentence || '';
      const translation = document.createElement('textarea');
      translation.id = 'translation';
      translation.maxLength = 1000;
      translation.placeholder = 'Tôi mệt. Tôi nằm nghỉ một lúc.';
      translation.value = state.selected.exampleTranslation || '';
      const target = document.createElement('input');
      target.id = 'target';
      target.maxLength = 255;
      target.placeholder = state.selected.word;
      target.value = state.selected.exampleTarget || state.selected.word || '';

      for (const [label, field] of [['Câu ví dụ tiếng Anh', sentence], ['Bản dịch tiếng Việt', translation], ['Cụm cần in đậm (tùy chọn)', target]]) {
        const group = document.createElement('div');
        group.className = 'field';
        const labelNode = document.createElement('label');
        labelNode.textContent = label;
        labelNode.htmlFor = field.id;
        group.append(labelNode, field);
        $('editor').append(group);
      }

      const preview = document.createElement('div');
      preview.className = 'preview';
      const previewTitle = createText('Xem trước', 'preview-title');
      const previewSentence = document.createElement('div');
      previewSentence.className = 'preview-sentence';
      const previewTranslation = createText('', 'preview-translation');
      preview.append(previewTitle, previewSentence, previewTranslation);
      $('editor').append(preview);

      const updatePreview = () => {
        renderHighlight(previewSentence, sentence.value.trim(), target.value.trim());
        previewTranslation.textContent = translation.value.trim();
      };
      sentence.addEventListener('input', updatePreview);
      translation.addEventListener('input', updatePreview);
      target.addEventListener('input', updatePreview);
      updatePreview();

      const actions = document.createElement('div');
      actions.className = 'actions';
      const remove = document.createElement('button');
      remove.className = 'danger';
      remove.type = 'button';
      remove.textContent = 'Xóa ví dụ';
      remove.disabled = !state.selected.exampleSentence;
      remove.addEventListener('click', deleteExample);
      const save = document.createElement('button');
      save.className = 'primary';
      save.type = 'button';
      save.textContent = 'Lưu ví dụ';
      save.addEventListener('click', () => saveExample(sentence, translation, target, save, remove));
      actions.append(remove, save);
      $('editor').append(actions);
    }

    async function loadWords() {
      $('word-list').replaceChildren(createText('Đang tải...', 'loading'));
      const params = new URLSearchParams({ page: state.page, pageSize: state.pageSize });
      if (state.query) params.set('q', state.query);
      if (state.hasExample !== 'all') params.set('hasExample', state.hasExample);
      try {
        const result = await api(`/api/examples?${params}`);
        state.rows = result.data || [];
        state.totalPages = result.pagination?.totalPages || 0;
        const selected = state.selected && state.rows.find((row) => row.id === state.selected.id);
        state.selected = selected || null;
        $('page-label').textContent = `Trang ${state.page}${state.totalPages ? ` / ${state.totalPages}` : ''}`;
        $('previous').disabled = state.page <= 1;
        $('next').disabled = !state.totalPages || state.page >= state.totalPages;
        setStatus(`${result.pagination?.totalItems || 0} từ`);
        renderWords();
        renderEditor();
      } catch (error) {
        state.rows = [];
        renderWords();
        setStatus(error.message, true);
      }
    }

    function selectWord(row) {
      state.selected = row;
      renderWords();
      renderEditor();
    }

    async function saveExample(sentence, translation, target, button, remove) {
      const body = { sentence: sentence.value, translation: translation.value, target: target.value };
      button.disabled = true;
      remove.disabled = true;
      try {
        state.selected = await api(`/api/words/${state.selected.id}/example`, { method: 'PUT', body: JSON.stringify(body) });
        setStatus('Đã lưu ví dụ.');
        await loadWords();
      } catch (error) {
        setStatus(error.message, true);
      } finally {
        button.disabled = false;
        remove.disabled = !state.selected?.exampleSentence;
      }
    }

    async function deleteExample() {
      if (!state.selected?.exampleSentence || !confirm(`Xóa ví dụ của “${state.selected.word}”?`)) return;
      try {
        const wordId = state.selected.id;
        await api(`/api/words/${wordId}/example`, { method: 'DELETE' });
        const row = state.rows.find((item) => item.id === wordId);
        if (row) {
          row.exampleSentence = '';
          row.exampleTranslation = '';
          row.exampleTarget = '';
          state.selected = row;
        }
        setStatus('Đã xóa ví dụ.');
        await loadWords();
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    let searchTimer;
    $('search').addEventListener('input', (event) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => { state.query = event.target.value.trim(); state.page = 1; loadWords(); }, 250);
    });
    $('example-filter').addEventListener('change', (event) => { state.hasExample = event.target.value; state.page = 1; loadWords(); });
    $('refresh').addEventListener('click', loadWords);
    $('previous').addEventListener('click', () => { if (state.page > 1) { state.page -= 1; loadWords(); } });
    $('next').addEventListener('click', () => { if (state.page < state.totalPages) { state.page += 1; loadWords(); } });
    $('login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = $('login-button');
      button.disabled = true;
      $('auth-error').textContent = '';
      try {
        await login($('phone').value);
        showManager();
      } catch (error) {
        $('auth-error').textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
    $('logout').addEventListener('click', () => {
      clearToken();
      state.selected = null;
      showAuth();
    });
    if (getToken()) showManager();
    else showAuth();
  </script>
</body>
</html>
