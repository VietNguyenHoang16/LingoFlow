name: DB backup

on:
  schedule:
    - cron: '30 18 * * *' # 01:30 sáng giờ Việt Nam (UTC+7)
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install latest postgres-client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pg_dump --version
          pg_dump "$DATABASE_URL" --no-owner --no-privileges -Fc -f backup.dump
          ls -lh backup.dump

      - name: Push to private backup repo
        env:
          TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          git config --global user.name "backup-bot"
          git config --global user.email "backup-bot@users.noreply.github.com"
          git clone "https://x-access-token:${TOKEN}@github.com/VietNguyenHoang16/lingoflow-backups.git" tmp
          mkdir -p tmp/backups
          cp backup.dump "tmp/backups/$(date -u +%Y-%m-%d).dump"
          cd tmp
          git add .
          git commit -m "backup $(date -u +%F)" || echo "Khong co thay doi moi"
          git push
